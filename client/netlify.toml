[build]
  command = "npm run build"
  publish = "dist"

# روی هاست استاتیک، API وجود ندارد — درخواست‌های /api باید ۴۰۴ برگردانند
# تا کلاینت به بک‌اند دموی مرورگر سوئیچ کند (نه اینکه index.html برگردد)
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
